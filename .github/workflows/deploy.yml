name: Deploy backend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to Vultr over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          set -euo pipefail

          # Strip BOM / CR / quotes / scheme that often sneak into GitHub secrets.
          HOST="$(printf '%s' "$VULTR_HOST" | sed $'s/^\xEF\xBB\xBF//' | tr -d '\r' | xargs || true)"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          HOST="${HOST//\"/}"
          HOST="${HOST//\'/}"

          USER="$(printf '%s' "$VULTR_USER" | sed $'s/^\xEF\xBB\xBF//' | tr -d '\r' | xargs || true)"
          USER="${USER//\"/}"
          USER="${USER//\'/}"
          USER="${USER%%@*}"

          echo "HOST_LENGTH=${#HOST}"
          echo "USER_LENGTH=${#USER}"
          printf 'HOST_HEX='
          printf '%s' "$HOST" | od -An -tx1 | tr -s ' ' | head -c 200
          echo
          printf 'USER_HEX='
          printf '%s' "$USER" | od -An -tx1 | tr -s ' ' | head -c 200
          echo

          if [[ -z "$HOST" || ! "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "VULTR_HOST is invalid. Expected bare IP/hostname like 64.177.49.126" >&2
            echo "Common mistakes: pasted SSH key into VULTR_HOST, quotes, https://, spaces, BOM" >&2
            exit 1
          fi
          if [[ -z "$USER" || ! "$USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "VULTR_USER is invalid. Expected username only (no user@host)." >&2
            exit 1
          fi
          echo "Deploy target user=$USER host=$HOST"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Keep PEM newlines intact; tolerate secrets pasted with literal \n.
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/questmaster/HackTX2026
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ ! -x backend/.venv/bin/pip ]; then
            echo "Existing virtualenv not found at backend/.venv" >&2
            exit 1
          fi
          backend/.venv/bin/pip install -r backend/requirements.txt
          sudo systemctl restart questmaster-backend
          sleep 2
          if ! sudo systemctl is-active --quiet questmaster-backend; then
            echo "questmaster-backend is not active after restart" >&2
            sudo systemctl status questmaster-backend --no-pager -l || true
            sudo journalctl -u questmaster-backend -n 80 --no-pager || true
            exit 1
          fi
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo
              ok=1
              break
            fi
            echo "health attempt $i/30 failed; waiting..."
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "Backend health check failed" >&2
            sudo systemctl status questmaster-backend --no-pager -l || true
            sudo journalctl -u questmaster-backend -n 120 --no-pager || true
            ss -lptn 'sport = :8000' || true
            exit 1
          fi
          EOF
